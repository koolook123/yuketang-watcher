[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuketang-watcher"
version = "0.1.0"
description = "Monitor Yuketang homework/exercise/discussion and notify via configurable channels"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yuketang-guardian = "yuketang_watch.guardian:main"
yuketang-watcher = "yuketang_watch.watcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yuketang_watch = ["web/*", "templates/*"]
